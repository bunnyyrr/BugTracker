server:
  port: 8080

spring:
  application:
    name: bugtracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bugtracker}
    username: ${SPRING_DATASOURCE_USERNAME:bugtracker}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-32b}
    expiration-hours: 24
  storage:
    path: ./uploads